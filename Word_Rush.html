<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Rush Demo</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #080b16;
      --ink: #f8fafc;
      --muted: #94a3b8;
      --card: #111827;
      --line: rgba(148, 163, 184, 0.24);
      --blue: #38bdf8;
      --pink: #db2777;
      --green: #15803d;
      --orange: #c2410c;
      --red: #dc2626;
      --panel: rgba(15, 23, 42, 0.86);
      --panel-strong: rgba(17, 24, 39, 0.94);
      --glow-blue: rgba(56, 189, 248, 0.42);
      --glow-pink: rgba(236, 72, 153, 0.28);
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 14% 8%, rgba(56, 189, 248, 0.26), transparent 34%),
        radial-gradient(circle at 88% 18%, rgba(168, 85, 247, 0.20), transparent 32%),
        radial-gradient(circle at 50% 100%, rgba(236, 72, 153, 0.12), transparent 36%),
        linear-gradient(180deg, #050816, var(--bg));
      color: var(--ink);
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 18px 44px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 116px;
      border-radius: 999px;
      padding: 8px 13px;
      background: #eef2ff;
      color: #3730a3;
      font-weight: 900;
      font-size: 13px;
      white-space: nowrap;
    }

    .layout {
      display: block;
    }

    .hidden { display: none !important; }

    .card {
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(17, 24, 39, 0.86));
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 22px;
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
    }

    .side-panel {
      position: sticky;
      top: 18px;
    }

    .start-screen {
      min-height: calc(100vh - 72px);
      display: grid;
      place-items: center;
      padding: 28px 0;
    }

    .start-card {
      width: min(520px, 100%);
      display: grid;
      gap: 18px;
      text-align: center;
    }

    .start-card h1 {
      font-size: 52px;
    }

    .start-actions {
      display: grid;
      gap: 12px;
    }

    .start-actions button {
      width: 100%;
      font-size: 16px;
    }

    .start-dictionary {
      display: grid;
      gap: 10px;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.5;
    }

    .policy-links {
      margin-top: 8px;
      font-size: 12px;
      text-align: center;
    }

    .policy-links a {
      color: var(--muted);
      text-decoration: underline;
      font-weight: 800;
    }

    .policy-links a:hover {
      color: var(--ink);
    }

    .start-panel {
      display: grid;
      gap: 10px;
      text-align: left;
    }

    .friend-match-menu {
      display: grid;
      gap: 10px;
    }

    .friend-match-menu button,
    .start-panel button {
      width: 100%;
    }

    .start-panel h2 {
      margin: 0;
      text-align: center;
      font-size: 22px;
      letter-spacing: -0.03em;
    }

    .start-panel input {
      text-transform: uppercase;
    }

    .online-status {
      min-height: 20px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }

    .waiting-room-card {
      width: min(520px, 100%);
      display: grid;
      gap: 12px;
      text-align: center;
    }

    .waiting-room-card h2 {
      margin: 0;
      font-size: 28px;
      letter-spacing: -0.04em;
    }

    .waiting-room-meta {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 850;
      line-height: 1.5;
    }

    .room-code-view {
      color: var(--ink);
      font-size: 38px;
      font-weight: 950;
      letter-spacing: 0.12em;
      line-height: 1;
    }

    .waiting-spinner {
      width: 38px;
      height: 38px;
      margin: 2px auto 4px;
      border-radius: 999px;
      border: 4px solid rgba(148, 163, 184, 0.22);
      border-top-color: var(--blue);
      animation: waitingSpin 900ms linear infinite;
    }

    @keyframes waitingSpin {
      to { transform: rotate(360deg); }
    }

    .controls {
      display: grid;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      font-weight: 900;
      cursor: pointer;
      background: linear-gradient(180deg, #38bdf8, #2563eb);
      color: #eff6ff;
      box-shadow: 0 12px 30px rgba(37, 99, 235, 0.26);
      transition: transform 0.08s ease, opacity 0.15s ease, filter 0.15s ease;
    }

    button:hover { transform: translateY(-1px); }

    button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      transform: none;
      filter: grayscale(0.2);
    }

    .secondary {
      background: rgba(30, 41, 59, 0.92);
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: none;
    }
    .blue { background: var(--blue); }
    .pink { background: var(--pink); }
    .green { background: var(--green); }
    .orange { background: var(--orange); }
    .red { background: var(--red); }

    .meta {
      display: grid;
      gap: 8px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 7px 10px;
      background: #f3f4f6;
      color: #374151;
      font-size: 12px;
      font-weight: 800;
    }

    .round-card {
      display: grid;
      gap: 16px;
    }

    .round-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .round-label {
      color: var(--muted);
      font-weight: 800;
      font-size: 13px;
    }

    .rule-visual {
      display: grid;
      gap: 14px;
      align-items: stretch;
    }

    .rule-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 14px;
      align-items: center;
    }

    .rule-box {
      min-height: 150px;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(96, 165, 250, 0.34);
      background:
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.20), transparent 56%),
        linear-gradient(180deg, rgba(30, 41, 59, 0.96), rgba(15, 23, 42, 0.98));
      text-align: center;
      padding: 16px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 0 28px rgba(37, 99, 235, 0.16);
    }

    .rule-box .caption {
      color: #93c5fd;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .rule-box .main {
      font-size: 76px;
      font-weight: 950;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: -0.06em;
      color: #e0f2fe;
      text-shadow: 0 0 26px rgba(56, 189, 248, 0.34);
    }

    .rule-box.length-box {
      border-color: rgba(148, 163, 184, 0.28);
      background:
        radial-gradient(circle at 50% 0%, rgba(148, 163, 184, 0.16), transparent 58%),
        linear-gradient(180deg, rgba(31, 41, 55, 0.94), rgba(15, 23, 42, 0.96));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .rule-box.length-box .caption {
      color: #cbd5e1;
    }

    .rule-box.length-box .main {
      color: #f8fafc;
    }

    .rule-op {
      color: #64748b;
      font-size: 34px;
      font-weight: 900;
      text-align: center;
    }

    .rule-single {
      min-height: 150px;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(96, 165, 250, 0.34);
      background:
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.20), transparent 56%),
        linear-gradient(180deg, rgba(30, 41, 59, 0.96), rgba(15, 23, 42, 0.98));
      text-align: center;
      padding: 18px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 0 28px rgba(37, 99, 235, 0.16);
    }

    .rule-single .caption {
      color: #93c5fd;
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .rule-single .main {
      font-size: 72px;
      font-weight: 950;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: -0.04em;
      color: #e0f2fe;
      text-shadow: 0 0 26px rgba(56, 189, 248, 0.34);
    }

    .rule-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      margin-top: 8px;
    }

    .rule-chip {
      min-width: 96px;
      min-height: 96px;
      border-radius: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(30, 64, 175, 0.38);
      border: 1px solid rgba(147, 197, 253, 0.34);
      color: #e0f2fe;
      font-size: 64px;
      font-weight: 950;
      text-transform: uppercase;
    }

    .rule-pattern {
      color: #cbd5e1;
      font-size: 76px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-align: center;
      line-height: 1;
      white-space: nowrap;
    }

    .rule-pattern .target {
      color: #e0f2fe;
      text-shadow: 0 0 26px rgba(56, 189, 248, 0.45);
    }

    .rule-placeholder {
      min-height: 150px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      border: 1px dashed rgba(148, 163, 184, 0.32);
      background: rgba(15, 23, 42, 0.72);
      font-weight: 900;
    }

    .timebar-wrap {
      position: relative;
      width: 136px;
      height: 30px;
      border-radius: 999px;
      background: rgba(76, 29, 149, 0.32);
      overflow: hidden;
      border: 1px solid rgba(196, 181, 253, 0.34);
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.20);
    }

    .timebar-fill {
      position: absolute;
      inset: 0;
      height: 100%;
      width: 100%;
      transform-origin: left center;
      transform: scaleX(1);
      background: linear-gradient(90deg, #c4b5fd, #8b5cf6);
    }

    .timebar-text {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #f5f3ff;
      font-size: 13px;
      font-weight: 950;
      font-variant-numeric: tabular-nums;
    }

    .players {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
      margin-top: 18px;
    }

    #gameScreen.versus-mode .players {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .player-card {
      border-radius: 24px;
      padding: 18px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(17, 24, 39, 0.86));
      border: 1px solid rgba(56, 189, 248, 0.20);
      box-shadow:
        0 18px 54px rgba(0, 0, 0, 0.36),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: border-color 150ms ease, transform 150ms ease, background 150ms ease;
    }

    .player-card.a.active {
      border-color: rgba(56, 189, 248, 0.64);
      background:
        radial-gradient(circle at 50% 0%, rgba(14, 165, 233, 0.16), transparent 46%),
        linear-gradient(180deg, rgba(15, 23, 42, 0.95), rgba(17, 24, 39, 0.90));
      transform: translateY(-1px);
      box-shadow:
        0 18px 58px rgba(0, 0, 0, 0.40),
        0 0 34px rgba(14, 165, 233, 0.16);
    }
    .player-card.b.active { border-color: #ec4899; background: #fff1f8; transform: translateY(-1px); }

    .opponent-card {
      display: none;
      border-color: rgba(236, 72, 153, 0.22);
    }

    #gameScreen.versus-mode .opponent-card {
      display: grid;
    }

    #gameScreen.versus-mode .player-card.b.active {
      border-color: rgba(236, 72, 153, 0.64);
      background:
        radial-gradient(circle at 50% 0%, rgba(236, 72, 153, 0.16), transparent 46%),
        linear-gradient(180deg, rgba(15, 23, 42, 0.95), rgba(17, 24, 39, 0.90));
      transform: translateY(-1px);
      box-shadow:
        0 18px 58px rgba(0, 0, 0, 0.40),
        0 0 34px rgba(236, 72, 153, 0.14);
    }

    #gameScreen.versus-mode .player-card {
      display: grid;
      grid-template-rows: 12px minmax(0, 1fr);
      row-gap: 12px;
      min-height: 0;
      overflow: hidden;
    }

    #gameScreen.versus-mode .scorebar-wrap {
      margin: 0;
    }

    .scorebar-wrap {
      position: relative;
      height: 12px;
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.96);
      overflow: hidden;
      margin-bottom: 12px;
    }

    .scorebar-fill {
      height: 100%;
      width: 100%;
      transform-origin: left center;
      transform: scaleX(0);
      background: linear-gradient(90deg, #0ea5e9, #2563eb);
      box-shadow: 0 0 18px rgba(14, 165, 233, 0.36);
      transition:
        transform 400ms cubic-bezier(.16, 1, .3, 1),
        background 180ms ease,
        box-shadow 180ms ease;
    }

    .opponent-scorebar-fill {
      background: linear-gradient(90deg, #ec4899, #be185d);
      box-shadow: 0 0 18px rgba(236, 72, 153, 0.30);
    }

    .scorebar-wrap::after {
      content: "";
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      z-index: 3;
      pointer-events: none;
    }

    .scorebar-wrap::before {
      content: "";
      position: absolute;
      top: 50%;
      left: -100%;
      width: 50%;
      height: 2px;
      background: #fff;
      box-shadow: 0 0 calc(var(--impact-intensity, 0) * 30px) 5px #fff;
      z-index: 4;
      pointer-events: none;
      transform: translateY(-50%);
      opacity: 0;
    }

    .player-card.score-impact {
      --impact-shake: calc(var(--impact-intensity, 0) * 15px);
      animation: progress-impact-shake 400ms cubic-bezier(.36,.07,.19,.97) both;
    }

    .player-card.score-impact .scorebar-wrap {
      animation: progress-impact-hybrid 600ms ease-out;
    }

    .player-card.score-impact .scorebar-fill {
      box-shadow:
        0 0 calc(var(--impact-intensity, 0) * 80px) #fff,
        0 0 30px rgba(14, 165, 233, 0.65);
    }

    .player-card.score-impact .scorebar-wrap::after {
      animation: progress-impact-flash 600ms ease-out;
    }

    .player-card.score-overtake .scorebar-wrap::before,
    .player-card.score-correct .scorebar-wrap::before {
      opacity: 1;
      animation: progress-impact-streak 400ms ease-in;
    }

    .player-card.score-correct .scorebar-wrap::before {
      height: 6px;
      background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
      box-shadow: 0 0 calc(var(--impact-intensity, 0) * 40px) 10px rgba(255,255,255,0.8);
    }

    #gameScreen.max-effect-shake {
      animation: max-effect-screen-shake 980ms cubic-bezier(.25,.85,.2,1) both;
      transform-origin: center center;
      will-change: transform, filter;
    }

    @keyframes progress-impact-shake {
      10%, 90% { transform: translate3d(calc(-0.3 * var(--impact-shake, 0px)), 0, 0); }
      20%, 80% { transform: translate3d(calc(0.6 * var(--impact-shake, 0px)), 0, 0); }
      30%, 50%, 70% { transform: translate3d(calc(-1 * var(--impact-shake, 0px)), calc(-0.5 * var(--impact-shake, 0px)), 0); }
      40%, 60% { transform: translate3d(var(--impact-shake, 0px), calc(0.3 * var(--impact-shake, 0px)), 0); }
    }

    @keyframes progress-impact-hybrid {
      0% { transform: scale(1); filter: brightness(1) blur(0); }
      15% {
        transform: scale(calc(1 + 0.1 * var(--impact-intensity, 0)), calc(1 + 3 * var(--impact-intensity, 0)));
        filter: brightness(calc(1 + 25 * var(--impact-intensity, 0))) blur(calc(var(--impact-intensity, 0) * 3px));
      }
      100% { transform: scale(1); filter: brightness(1) blur(0); }
    }

    @keyframes progress-impact-flash {
      0% { opacity: 0; }
      10% { opacity: calc(0.4 + 0.6 * var(--impact-intensity, 0)); }
      100% { opacity: 0; }
    }

    @keyframes progress-impact-streak {
      0% { left: -100%; opacity: 1; }
      100% { left: 200%; opacity: 0; }
    }

    @keyframes max-effect-screen-shake {
      0% {
        transform: scale(1.02);
        filter: saturate(1.08) contrast(1.04);
      }
      5% {
        transform: scale(1.07) translate3d(-34px, 18px, 0) rotate(-1.4deg);
        filter: saturate(1.5) contrast(1.12);
      }
      10% {
        transform: scale(1.075) translate3d(46px, -22px, 0) rotate(1.55deg);
      }
      16% {
        transform: scale(1.07) translate3d(-56px, -26px, 0) rotate(-1.8deg);
      }
      23% {
        transform: scale(1.065) translate3d(60px, 30px, 0) rotate(1.9deg);
        filter: saturate(1.72) contrast(1.18);
      }
      31% {
        transform: scale(1.058) translate3d(-50px, 22px, 0) rotate(-1.35deg);
      }
      41% {
        transform: scale(1.048) translate3d(42px, -18px, 0) rotate(1.05deg);
      }
      52% {
        transform: scale(1.038) translate3d(-34px, 14px, 0) rotate(-0.8deg);
      }
      64% {
        transform: scale(1.028) translate3d(25px, -10px, 0) rotate(0.55deg);
        filter: saturate(1.3) contrast(1.09);
      }
      78% {
        transform: scale(1.017) translate3d(-15px, 6px, 0) rotate(-0.3deg);
      }
      90% {
        transform: scale(1.008) translate3d(8px, -3px, 0) rotate(0.14deg);
      }
      100% {
        transform: scale(1);
        filter: saturate(1) contrast(1);
      }
    }

    .input-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }

    input {
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 16px;
      padding: 13px 14px;
      font-size: 18px;
      font-weight: 800;
      outline: none;
      background: rgba(2, 6, 23, 0.66);
      color: var(--ink);
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.14);
    }

    .words {
      min-height: 124px;
      margin-top: 14px;
      padding: 12px;
      border-radius: 18px;
      background: rgba(2, 6, 23, 0.42);
      border: 1px solid rgba(148, 163, 184, 0.20);
    }

    #gameScreen.versus-mode #wordsA,
    #gameScreen.versus-mode #wordsB {
      min-height: 124px;
      margin: 0;
      align-self: stretch;
      overflow: auto;
    }

    .word-chip {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 7px 10px;
      margin: 4px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.24);
      color: #e0f2fe;
      font-size: 13px;
      font-weight: 900;
    }

    .hint {
      min-height: 24px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      font-weight: 700;
    }

    .hidden-opponent-hint {
      display: none;
    }

    .answer-panel {
      margin-top: 14px;
    }

    .answer-inner {
      width: min(760px, 100%);
      margin: 0 auto;
      border-radius: 22px;
      padding: 12px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.24);
      box-shadow:
        0 18px 54px rgba(0, 0, 0, 0.30),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(14px);
    }

    .answer-input-row {
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .answer-hint {
      margin-top: 8px;
    }

    .message {
      margin-top: 18px;
      padding: 16px 18px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid var(--line);
      text-align: center;
      font-weight: 900;
      line-height: 1.55;
    }

    .message.success { background: rgba(6, 78, 59, 0.60); color: #bbf7d0; border-color: rgba(52, 211, 153, 0.34); }
    .message.warn { background: rgba(124, 45, 18, 0.60); color: #fed7aa; border-color: rgba(251, 146, 60, 0.34); }

  <script>
    /*
      Supabase MVP schema for online matches:

      create table if not exists word_rush_rooms (
        id uuid primary key default gen_random_uuid(),
        room_code text unique,
        mode text not null,
        status text not null default 'waiting',
        host_id text not null,
        guest_id text,
        host_name text,
        guest_name text,
        current_round integer default 0,

        created_at timestamptz default now(),
        updated_at timestamptz default now(),
        started_at timestamptz,
        finished_at timestamptz
      );

      create table if not exists word_rush_room_events (
        id bigserial primary key,
        room_id uuid references word_rush_rooms(id) on delete cascade,
        event_type text not null,
        player_id text not null,
        player_role text not null,
        payload jsonb default '{}'::jsonb,
        server_time timestamptz default now(),
        created_at timestamptz default now()
      );

      create table if not exists word_rush_random_queue (
        id uuid primary key default gen_random_uuid(),
        player_id text not null,
        player_name text,
        status text not null default 'waiting',
        room_id uuid,
        created_at timestamptz default now(),
        updated_at timestamptz default now()
      );

      RLS policies are intentionally left for the production pass.
    */

    const WIN_SCORE = 50;
    const ROUND_SECONDS = 40;
    // Default generated-question range. Some rule types use a type-specific lower bound.
    const MIN_QUESTION_CANDIDATES = 1000;

    const CONTAINS_SEQUENCE_MIN_CANDIDATES = 2000;
    const QUESTION_PICK_MAX_ATTEMPTS = 500;
    const SUPABASE_URL = "https://lntgmwmjpwempyndezkr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxudGdtd21qcHdlbXB5bmRlemtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMDk4OTYsImV4cCI6MjA5Mzg4NTg5Nn0.q8X9OM_C3S0Di0So3ki7c_YjROTudvhnQ2gffdedGbQ";

    let supabaseClient = null;

    const lightningImageByVariant = {
      1: "assets/lightning_win1.png",

    const soundEffects = {

    };

    let soundUnlocked = false;

    let dictionary = new Set();
    let dictionarySource = "loading";

    function normalizeDictionaryWord(value) {
      return String(value)
        .trim()
        .toLowerCase()
        .replace(/#.*$/, "")
        .trim();
    }

    function buildDictionaryFromWordListText(text) {
      const words = text
        .split(/\r?\n/)
        .map(normalizeDictionaryWord)
        .filter((word) => /^[a-z]+$/.test(word) && word.length >= 3);

      return new Set(words);
    }

    function applyDictionaryText(text, sourceLabel) {
      const loadedDictionary = buildDictionaryFromWordListText(text);

      if (loadedDictionary.size === 0) {
        throw new Error(`${sourceLabel} contained no valid words`);
      }

      dictionary = loadedDictionary;
      dictionarySource = sourceLabel;
      log(`Dictionary loaded from ${sourceLabel}: ${dictionary.size.toLocaleString()} valid words.`);
      updateDictionaryInfo();
      setStatus("Ready");
      updateUI();
    }

    async function loadDictionary() {
      try {
        setStatus("Loading dictionary");
        const response = await fetch("./words_alpha.txt", { cache: "no-store" });

        if (!response.ok) {
          throw new Error(`./words_alpha.txt HTTP ${response.status}`);
        }

        const text = await response.text();
        applyDictionaryText(text, "words_alpha.txt");
      } catch (error) {
        dictionary = new Set();
        dictionarySource = "load failed";
        log(`Failed to auto-load words_alpha.txt. Reason: ${error.message}`);
        log("The app first tries to load ./words_alpha.txt from the same folder as this HTML file.");
        log("If you opened this HTML directly with file://, browser security may block that read. Start a local server in /Users/kobayashihikari/Desktop/app_developer/Word_Rush with: python3 -m http.server 8000");
        setMessage("同じフォルダの words_alpha.txt の自動読み込みに失敗しました。file://で開いている場合は、/Users/kobayashihikari/Desktop/app_developer/Word_Rush で python3 -m http.server 8000 を実行し、http://localhost:8000/Word_Rush.html を開いてください。", "warn");
        updateDictionaryInfo();
        setStartNotice("辞書を読み込めませんでした。Load words_alpha.txt から手動で読み込んでください。", "warn");
        setStatus("Dictionary missing");
        updateUI();
      }
    }

    function loadDictionaryFromFile(file) {
      if (!file) return;

      const reader = new FileReader();

      reader.onload = () => {
        try {
          applyDictionaryText(String(reader.result || ""), file.name || "selected dictionary file");
          setMessage(`${file.name} を辞書として読み込みました。`, "success");
        } catch (error) {
          log(`Failed to load selected dictionary file: ${error.message}`);
          setMessage(`辞書ファイルの読み込みに失敗しました: ${error.message}`, "danger");
        }
      };

      reader.onerror = () => {
        log("Failed to read selected dictionary file.");
        setMessage("選択した辞書ファイルを読み込めませんでした。", "danger");
      };

      reader.readAsText(file);
    }

    const COMMON_START_LETTERS = "abcdefghijklmnopqrstuvwxyz".split("");
    const COMMON_END_LETTERS = "abcdefghijklmnopqrstuvwxyz".split("");
    const NTH_LETTER_POSITIONS = [2, 3, 4];
    const NTH_LETTER_DIRECTIONS = ["front", "back"];
    const NTH_LETTER_OPTIONS = "abcdefghijklmnopqrstuvwxyz".split("");
    const CONTAINS_LETTER_OPTIONS = "abcdefghijklmnopqrstuvwxyz".split("");
    const EXACT_LENGTH_OPTIONS = [5, 6, 7];
    const MIN_LENGTH_OPTIONS = [8, 9, 10];
    const QUESTION_TYPES = [
      "start_end",
      "edge_min_length",
      "nth_letter",
      "contains_letters",
      "contains_sequence"
    ];

    const RECENT_TYPE_SKIP_THRESHOLD = 20;

    const state = {
      status: "ready",
      matchMode: "single",
      roundIndex: 0,
      currentQuestion: null,
      lastQuestionType: null,
      scores: { A: 0, B: 0 },
      roundWords: { A: [], B: [] },
      roundRoundScores: { A: 0, B: 0 },
      usedWords: new Set(),
      usedQuestionKeys: new Set(),
      timer: null,
      roundStart: null,
      remainingMs: ROUND_SECONDS * 1000,
      matchOver: false
    };

    const onlineState = {
      enabled: false,
      mode: null,
      roomId: null,
      roomCode: null,
      playerId: null,
      playerRole: null,
      opponentId: null,
      channel: null,
      questionSet: [],
      currentRoundStartedAt: null,
      queueId: null,
      isHost: false,
      countdownStarted: false,
      processedEventIds: new Set(),
      rematchReadyPlayers: new Set(),
      leavingOnline: false
    };

    function getRandomFromArray(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function getQuestionLabel(q) {
      if (!q) return "A word matching the rule";
      switch (q.type) {
        case "start_end":
          return `Words starting with ${q.start.toUpperCase()} and ending with ${q.end.toUpperCase()}`;
        case "edge_min_length":
          if (q.lengthMode === "exact") {
            if (q.side === "start") return `Words starting with ${q.start.toUpperCase()} and exactly ${q.minLen} letters long`;
            return `Words ending with ${q.end.toUpperCase()} and exactly ${q.minLen} letters long`;
          }
          if (q.side === "start") return `Words starting with ${q.start.toUpperCase()} and at least ${q.minLen} letters long`;
          return `Words ending with ${q.end.toUpperCase()} and at least ${q.minLen} letters long`;
        case "nth_letter":
          if (q.direction === "back") return `Words with ${q.letter.toUpperCase()} as the ${q.n}th letter from the end`;
          return `Words with ${q.letter.toUpperCase()} as the ${q.n}th letter`;
        case "contains_letters":
          return `Words containing all of ${q.letters.map((l) => l.toUpperCase()).join(", ")}`;
        case "contains_sequence":
          return `Words containing ${q.sequence.toUpperCase()}`;
        // backward compatibility for older names
        case "start_min_length":
          return `Words starting with ${q.start.toUpperCase()} and at least ${q.minLen} letters long`;
        case "end_min_length":
          return `Words ending with ${q.end.toUpperCase()} and at least ${q.minLen} letters long`;
        case "second_letter":
          return `Words with ${q.letter.toUpperCase()} as the 2nd letter`;
        case "contains_both":
          return `Words containing ${q.letters.map((letter) => letter.toUpperCase()).join(" and ")}`;
        default:
          return "A word matching the rule";
      }
    }

    function getQuestionKey(q) {
      if (!q) return "";

      switch (q.type) {
        case "start_end":
          return `start_end:${q.start || ""}:${q.end || ""}`;
        case "edge_min_length":
          return `edge_min_length:${q.side || ""}:${q.start || q.end || ""}:${q.lengthMode || "min"}:${q.minLen || ""}:${q.maxLen || ""}`;
        case "nth_letter":
          return `nth_letter:${q.direction || "front"}:${q.n || ""}:${q.letter || ""}`;
        case "contains_letters":
          return `contains_letters:${(q.letters || []).slice().sort().join("")}`;
        case "contains_sequence":
          return `contains_sequence:${q.sequence || ""}`;
        case "start_min_length":
          return `edge_min_length:start:${q.start || ""}:min:${q.minLen || ""}:${q.maxLen || ""}`;
        case "end_min_length":
          return `edge_min_length:end:${q.end || ""}:min:${q.minLen || ""}:${q.maxLen || ""}`;
        case "second_letter":
          return `nth_letter:front:2:${q.letter || ""}`;
        case "contains_both":
          return `contains_letters:${(q.letters || []).slice().sort().join("")}`;
        default:
          return `${q.type || "unknown"}:${JSON.stringify(q)}`;
      }
    }

    function isQuestionAlreadyUsed(q) {
      const key = getQuestionKey(q);
      return key ? state.usedQuestionKeys.has(key) : false;
    }

    function getPrimaryDisplay(q) {
      if (!q) return "?";
      switch (q.type) {
        case "start_end":
          return q.start ? q.start.toUpperCase() : "?";
        case "edge_min_length":
          return q.side === "start" ? (q.start ? q.start.toUpperCase() : "?") : "ANY";
        case "nth_letter":
          return "_";
        case "contains_letters":
          return q.letters.map((letter) => letter.toUpperCase()).join("");
        case "contains_sequence":
          return q.sequence.toUpperCase();
        default:
          return "?";
      }
    }

    function getSecondaryDisplay(q) {
      if (!q) return "?";
      switch (q.type) {
        case "start_end":
          return q.end ? q.end.toUpperCase() : "?";
        case "edge_min_length":
          return q.side === "start" ? `${q.minLen}+` : (q.end ? q.end.toUpperCase() : "?");
        case "nth_letter":
          return q.letter.toUpperCase();
        case "contains_letters":
          return "ALL";
        case "contains_sequence":
          return "IN";
        default:
          return "?";
      }
    }

    function buildRandomLetters(length) {
      const letters = "abcdefghijklmnopqrstuvwxyz";
      let value = "";

      for (let i = 0; i < length; i++) {
        value += letters[Math.floor(Math.random() * letters.length)];
      }

      return value;
    }

    function buildRandomSequenceQuestionCandidate() {
      const length = getRandomFromArray(SEQUENCE_LENGTH_OPTIONS);
      const sequence = buildRandomLetters(length);

      return {
        type: "contains_sequence",
        sequence,
        minLen: 3,
        maxLen: null
      };
    }

    function buildQuestionCandidateByType(type, dictionaryWords = []) {
      if (type === "start_end") {
        return {
          type: "start_end",
          start: getRandomFromArray(COMMON_START_LETTERS),
          end: getRandomFromArray(COMMON_END_LETTERS),
          minLen: 3,
          maxLen: null
        };
      }

      if (type === "edge_min_length") {
        // choose whether the edge restriction is on the start or end
        const side = Math.random() < 0.5 ? "start" : "end";
        const lengthMode = Math.random() < 0.5 ? "min" : "exact";
        const minLen = lengthMode === "exact" ? getRandomFromArray(EXACT_LENGTH_OPTIONS) : getRandomFromArray(MIN_LENGTH_OPTIONS);
        const maxLen = lengthMode === "exact" ? minLen : null;
        if (side === "start") {
          return { type: "edge_min_length", side: "start", lengthMode, start: getRandomFromArray(COMMON_START_LETTERS), minLen, maxLen };
        }
        return { type: "edge_min_length", side: "end", lengthMode, end: getRandomFromArray(COMMON_END_LETTERS), minLen, maxLen };
      }

      if (type === "nth_letter") {
        const n = getRandomFromArray(NTH_LETTER_POSITIONS);
        const direction = getRandomFromArray(NTH_LETTER_DIRECTIONS);
        return { type: "nth_letter", direction, n, letter: getRandomFromArray(NTH_LETTER_OPTIONS), minLen: n, maxLen: null };
      }

      if (type === "contains_letters") {
        // choose 2 or 3 distinct letters
        const k = Math.random() < 0.5 ? 2 : 3;
        const pool = CONTAINS_LETTER_OPTIONS.slice();
        const letters = [];
        while (letters.length < k && pool.length) {
          const i = Math.floor(Math.random() * pool.length);
          letters.push(pool.splice(i, 1)[0]);
        }
        return { type: "contains_letters", letters, minLen: 3, maxLen: null };
      }

      return buildRandomSequenceQuestionCandidate();
    }

    // Build a random candidate condition by first picking one of the five
    // canonical types, then producing concrete parameters for that type.
    function buildRandomQuestionCandidate(dictionaryWords) {
      return buildQuestionCandidateByType(getRandomFromArray(QUESTION_TYPES), dictionaryWords);
    }

    function hydrateQuestion(q, candidates) {
      const candidateCount = candidates.length;
      return {
        ...q,
        candidateCount,
        difficulty: getQuestionDifficulty(candidateCount),
        label: getQuestionLabel(q),
        note: [getQuestionLabel(q), getQuestionRuleNote(candidateCount)].filter(Boolean).join(". "),
        candidates
      };
    }

    function isCandidateCountInRange(count) {
      return count >= MIN_QUESTION_CANDIDATES && count <= MAX_QUESTION_CANDIDATES;
    }

    function acceptsCandidateCount(q, count) {
      if (q && q.type === "contains_sequence") {
        return count >= CONTAINS_SEQUENCE_MIN_CANDIDATES;
      }
      if (q && q.type === "edge_min_length") {
        return count >= EDGE_LENGTH_MIN_CANDIDATES;
      }
      return isCandidateCountInRange(count);
    }

    function getCandidateCountDistance(count) {
      if (count < MIN_QUESTION_CANDIDATES) return MIN_QUESTION_CANDIDATES - count;
      if (count > MAX_QUESTION_CANDIDATES) return count - MAX_QUESTION_CANDIDATES;
      return 0;
    }

    function getQuestionCandidateCountDistance(q, count) {
      if (q && q.type === "contains_sequence") {
        return count < CONTAINS_SEQUENCE_MIN_CANDIDATES ? CONTAINS_SEQUENCE_MIN_CANDIDATES - count : 0;
      }
      if (q && q.type === "edge_min_length") {
        return count < EDGE_LENGTH_MIN_CANDIDATES ? EDGE_LENGTH_MIN_CANDIDATES - count : 0;
      }
      return getCandidateCountDistance(count);
    }

    function wordsForQuestion(q) {
      if (!q) return [];

      if (q.candidates && Array.isArray(q.candidates)) {
        return q.candidates;
      }

      return Array.from(dictionary).filter((word) => isWordMatchingQuestion(word, q));
    }

    // Candidate limits are controlled by global MIN_QUESTION_CANDIDATES / MAX_QUESTION_CANDIDATES

    // === DEBUG HELPERS ===
    const DEBUG_SAMPLE_ANSWER_LIMIT = 12;
    const DEBUG_CONSOLE_TOP_LIMIT = 10;

    function createQuestionSpaceRow(q, candidateCount, sampleAnswers = []) {
      return {
        type: q.type,
        key: getQuestionKey(q),
        label: getQuestionLabel(q),
        candidateCount,
        acceptedByCurrentRules: acceptsCandidateCount(q, candidateCount),
        sampleAnswers: sampleAnswers.slice(0, DEBUG_SAMPLE_ANSWER_LIMIT).join(", ")
      };
    }

    function makeQuestionSpaceDebugStats(rows, totalQuestionKindsOverride = null) {
      const counts = rows.map((row) => row.candidateCount);
      const acceptedRows = rows.filter((row) => row.acceptedByCurrentRules);
      const acceptedCounts = acceptedRows.map((row) => row.candidateCount);
      const totalQuestionKinds = totalQuestionKindsOverride === null ? rows.length : totalQuestionKindsOverride;
      const averageCandidateCount = counts.length ? counts.reduce((sum, count) => sum + count, 0) / totalQuestionKinds : 0;
      const acceptedAverageCandidateCount = acceptedCounts.length ? acceptedCounts.reduce((sum, count) => sum + count, 0) / acceptedCounts.length : 0;

      return {
        totalQuestionKinds,
        acceptedQuestionKinds: acceptedRows.length,
        rejectedQuestionKinds: totalQuestionKinds - acceptedRows.length,
        minCandidateCount: counts.length ? Math.min(...counts) : 0,
        maxCandidateCount: counts.length ? Math.max(...counts) : 0,
        averageCandidateCount,
        acceptedMinCandidateCount: acceptedCounts.length ? Math.min(...acceptedCounts) : 0,
        acceptedMaxCandidateCount: acceptedCounts.length ? Math.max(...acceptedCounts) : 0,
        acceptedAverageCandidateCount
      };
    }

    function buildQuestionSpaceExceptSequencesForDebug(dictionaryWords) {
      const rows = [];

      COMMON_START_LETTERS.forEach((start) => {
        COMMON_END_LETTERS.forEach((end) => {
          const q = { type: "start_end", start, end, minLen: 3, maxLen: null };
          const candidates = dictionaryWords.filter((word) => isWordMatchingQuestion(word, q));
          rows.push(createQuestionSpaceRow(q, candidates.length, candidates));
        });
      });

      MIN_LENGTH_OPTIONS.forEach((minLen) => {
        COMMON_START_LETTERS.forEach((start) => {
          const q = { type: "edge_min_length", side: "start", lengthMode: "min", start, minLen, maxLen: null };
          const candidates = dictionaryWords.filter((word) => isWordMatchingQuestion(word, q));
          rows.push(createQuestionSpaceRow(q, candidates.length, candidates));
        });
        COMMON_END_LETTERS.forEach((end) => {
          const q = { type: "edge_min_length", side: "end", lengthMode: "min", end, minLen, maxLen: null };
          const candidates = dictionaryWords.filter((word) => isWordMatchingQuestion(word, q));
          rows.push(createQuestionSpaceRow(q, candidates.length, candidates));
        });
      });

      EXACT_LENGTH_OPTIONS.forEach((minLen) => {
        COMMON_START_LETTERS.forEach((start) => {
          const q = { type: "edge_min_length", side: "start", lengthMode: "exact", start, minLen, maxLen: minLen };
          const candidates = dictionaryWords.filter((word) => isWordMatchingQuestion(word, q));
          rows.push(createQuestionSpaceRow(q, candidates.length, candidates));
        });
        COMMON_END_LETTERS.forEach((end) => {
          const q = { type: "edge_min_length", side: "end", lengthMode: "exact", end, minLen, maxLen: minLen };
          const candidates = dictionaryWords.filter((word) => isWordMatchingQuestion(word, q));
          rows.push(createQuestionSpaceRow(q, candidates.length, candidates));
        });
      });

      NTH_LETTER_POSITIONS.forEach((n) => {
        NTH_LETTER_DIRECTIONS.forEach((direction) => {
          NTH_LETTER_OPTIONS.forEach((letter) => {
            const q = { type: "nth_letter", direction, n, letter, minLen: n, maxLen: null };
            const candidates = dictionaryWords.filter((word) => isWordMatchingQuestion(word, q));
            rows.push(createQuestionSpaceRow(q, candidates.length, candidates));
          });
        });
      });

      for (let i = 0; i < CONTAINS_LETTER_OPTIONS.length; i++) {
        for (let j = i + 1; j < CONTAINS_LETTER_OPTIONS.length; j++) {
          const q2 = { type: "contains_letters", letters: [CONTAINS_LETTER_OPTIONS[i], CONTAINS_LETTER_OPTIONS[j]], minLen: 3, maxLen: null };
          const candidates2 = dictionaryWords.filter((word) => isWordMatchingQuestion(word, q2));
          rows.push(createQuestionSpaceRow(q2, candidates2.length, candidates2));

          for (let k = j + 1; k < CONTAINS_LETTER_OPTIONS.length; k++) {
            const q3 = { type: "contains_letters", letters: [CONTAINS_LETTER_OPTIONS[i], CONTAINS_LETTER_OPTIONS[j], CONTAINS_LETTER_OPTIONS[k]], minLen: 3, maxLen: null };
            const candidates3 = dictionaryWords.filter((word) => isWordMatchingQuestion(word, q3));
            rows.push(createQuestionSpaceRow(q3, candidates3.length, candidates3));
          }
        }
      }

      return rows;
    }

    function getSequenceQuestionKindCountForDebug() {
      return SEQUENCE_LENGTH_OPTIONS.reduce((sum, length) => sum + Math.pow(26, length), 0);
    }

    function forEachSequenceForDebug(callback) {
      const letters = "abcdefghijklmnopqrstuvwxyz";

      SEQUENCE_LENGTH_OPTIONS.forEach((length) => {
        const total = Math.pow(26, length);
        for (let index = 0; index < total; index++) {
          let value = "";
          let n = index;

          for (let i = 0; i < length; i++) {
            value = letters[n % letters.length] + value;
            n = Math.floor(n / letters.length);
          }

          callback(value);
        }
      });
    }

    function buildSequenceQuestionSpaceForDebug(dictionaryWords) {
      const counts = new Map();
      const examples = new Map();
      const lengths = Array.from(new Set(SEQUENCE_LENGTH_OPTIONS));

      dictionaryWords.forEach((word) => {
        if (!/^[a-z]+$/.test(word) || word.length < 3) return;
        const seenInWord = new Set();

        lengths.forEach((len) => {
          if (word.length >= len) {
            for (let i = 0; i <= word.length - len; i++) {
              const sequence = word.slice(i, i + len);
              seenInWord.add(sequence);
            }
          }
        });

        seenInWord.forEach((sequence) => {
          counts.set(sequence, (counts.get(sequence) || 0) + 1);
          if (!examples.has(sequence)) examples.set(sequence, []);
          const list = examples.get(sequence);
          if (list.length < DEBUG_SAMPLE_ANSWER_LIMIT) list.push(word);
        });
      });

      const rows = [];
      let totalCandidateCountAcrossAllSequences = 0;
      let maxCandidateCount = 0;

      forEachSequenceForDebug((sequence) => {
        const candidateCount = counts.get(sequence) || 0;
        totalCandidateCountAcrossAllSequences += candidateCount;
        if (candidateCount > maxCandidateCount) maxCandidateCount = candidateCount;
        if (candidateCount < CONTAINS_SEQUENCE_MIN_CANDIDATES) return;

        const q = { type: "contains_sequence", sequence, minLen: 3, maxLen: null };
        rows.push(createQuestionSpaceRow(q, candidateCount, examples.get(sequence) || []));
      });

      rows.sort((a, b) => b.candidateCount - a.candidateCount || a.key.localeCompare(b.key));

      return {
        rows,
        totalQuestionKinds: getSequenceQuestionKindCountForDebug(),
        totalCandidateCountAcrossAllSequences,
        minCandidateCount: 0,
        maxCandidateCount
      };
    }

    function summarizeQuestionRowsByType(rows, sequenceDebug = null) {
      return QUESTION_TYPES.map((type) => {
        const typeRows = rows.filter((row) => row.type === type);
        const stats = makeQuestionSpaceDebugStats(
          typeRows,
          type === "contains_sequence" && sequenceDebug ? sequenceDebug.totalQuestionKinds : null
        );

        if (type === "contains_sequence" && sequenceDebug) {
          stats.minCandidateCount = sequenceDebug.minCandidateCount;
          stats.maxCandidateCount = sequenceDebug.maxCandidateCount;
          stats.averageCandidateCount = sequenceDebug.totalCandidateCountAcrossAllSequences / sequenceDebug.totalQuestionKinds;
        }

        return {
          type,
          totalQuestionKinds: stats.totalQuestionKinds,
          acceptedQuestionKinds: stats.acceptedQuestionKinds,
          rejectedQuestionKinds: stats.rejectedQuestionKinds,
          minCandidateCount: Math.round(stats.minCandidateCount),
          averageCandidateCount: Math.round(stats.averageCandidateCount),
          maxCandidateCount: Math.round(stats.maxCandidateCount),
          acceptedMinCandidateCount: Math.round(stats.acceptedMinCandidateCount),
          acceptedAverageCandidateCount: Math.round(stats.acceptedAverageCandidateCount),
          acceptedMaxCandidateCount: Math.round(stats.acceptedMaxCandidateCount)
        };
      });
    }

    function debugAnalyzeQuestionSpace() {
      if (dictionary.size === 0) {
        console.warn("Dictionary is not loaded yet.");
        return null;
      }

      console.time("debugAnalyzeQuestionSpace");
      const dictionaryWords = Array.from(dictionary);
      const nonSequenceRows = buildQuestionSpaceExceptSequencesForDebug(dictionaryWords);
      const sequenceDebug = buildSequenceQuestionSpaceForDebug(dictionaryWords);
      const rows = nonSequenceRows.concat(sequenceDebug.rows);
      const acceptedRows = rows.filter((row) => row.acceptedByCurrentRules);
      const byType = summarizeQuestionRowsByType(rows, sequenceDebug);
      const topAcceptedByType = {};

      QUESTION_TYPES.forEach((type) => {
        topAcceptedByType[type] = acceptedRows
          .filter((row) => row.type === type)
          .sort((a, b) => b.candidateCount - a.candidateCount || a.key.localeCompare(b.key));
      });

      window.wordRushQuestionSpaceDebug = {
        generatedAt: new Date().toISOString(),
        dictionarySize: dictionaryWords.length,
        byType,
        rows,
        acceptedRows,
        topAcceptedByType,
        note: "rows includes all non-sequence question kinds and accepted contains_sequence kinds. Rejected contains_sequence rows are summarized only to keep the console responsive."
      };

      console.log("[WordRush Debug] Question space summary by type");
      console.table(byType);

      QUESTION_TYPES.forEach((type) => {
        console.log(`[WordRush Debug] ${type}: accepted questions sorted by candidateCount desc, top ${DEBUG_CONSOLE_TOP_LIMIT}. Full list: window.wordRushQuestionSpaceDebug.topAcceptedByType.${type}`);
        console.table(topAcceptedByType[type].slice(0, DEBUG_CONSOLE_TOP_LIMIT));
      });

      console.timeEnd("debugAnalyzeQuestionSpace");
      console.log("Use window.wordRushQuestionSpaceDebug.acceptedRows for all accepted rows.");
      console.log("Use window.wordRushQuestionSpaceDebug.topAcceptedByType[type] for per-type accepted rows sorted by candidate count.");
      return window.wordRushQuestionSpaceDebug;
    }

    function debugAnalyzeAcceptedQuestionSpace() {
      const result = debugAnalyzeQuestionSpace();
      if (!result) return null;

      const acceptedRows = result.acceptedRows.slice().sort((a, b) => b.candidateCount - a.candidateCount);
      const acceptedByType = summarizeQuestionRowsByType(acceptedRows).map((row) => ({
        type: row.type,
        acceptedQuestionKinds: row.totalQuestionKinds,
        shareOfAcceptedKinds: acceptedRows.length ? row.totalQuestionKinds / acceptedRows.length : 0,
        maxCandidateCount: row.acceptedMaxCandidateCount,
        minCandidateCount: row.acceptedMinCandidateCount,
        averageCandidateCount: row.acceptedAverageCandidateCount
      }));

      window.wordRushAcceptedQuestionSpaceDebug = { acceptedByType, acceptedRows };
      console.log("[WordRush Debug] Accepted question space summary by type");
      console.table(acceptedByType);
      console.log(`[WordRush Debug] All accepted questions sorted by candidateCount desc, top ${DEBUG_CONSOLE_TOP_LIMIT}`);
      console.table(acceptedRows.slice(0, DEBUG_CONSOLE_TOP_LIMIT));
      return window.wordRushAcceptedQuestionSpaceDebug;
    }

    // === END DEBUG HELPERS ===

    function buildFallbackQuestionCandidates(dictionaryWords) {
      const rows = [];
      const sequenceKeys = new Set();

      COMMON_START_LETTERS.forEach((start) => {
        COMMON_END_LETTERS.forEach((end) => {
          rows.push({ type: "start_end", start, end, minLen: 3, maxLen: null });
        });
      });

      MIN_LENGTH_OPTIONS.forEach((minLen) => {
        COMMON_START_LETTERS.forEach((start) => {
          rows.push({ type: "edge_min_length", side: "start", lengthMode: "min", start, minLen, maxLen: null });
        });
        COMMON_END_LETTERS.forEach((end) => {
          rows.push({ type: "edge_min_length", side: "end", lengthMode: "min", end, minLen, maxLen: null });
        });
      });

      EXACT_LENGTH_OPTIONS.forEach((minLen) => {
        COMMON_START_LETTERS.forEach((start) => {
          rows.push({ type: "edge_min_length", side: "start", lengthMode: "exact", start, minLen, maxLen: minLen });
        });
        COMMON_END_LETTERS.forEach((end) => {
          rows.push({ type: "edge_min_length", side: "end", lengthMode: "exact", end, minLen, maxLen: minLen });
        });
      });

      NTH_LETTER_POSITIONS.forEach((n) => {
        NTH_LETTER_DIRECTIONS.forEach((direction) => {
          NTH_LETTER_OPTIONS.forEach((letter) => {
            rows.push({ type: "nth_letter", direction, n, letter, minLen: n, maxLen: null });
          });
        });
      });

      for (let i = 0; i < CONTAINS_LETTER_OPTIONS.length; i++) {
        for (let j = i + 1; j < CONTAINS_LETTER_OPTIONS.length; j++) {
          rows.push({ type: "contains_letters", letters: [CONTAINS_LETTER_OPTIONS[i], CONTAINS_LETTER_OPTIONS[j]], minLen: 3, maxLen: null });
          for (let k = j + 1; k < CONTAINS_LETTER_OPTIONS.length; k++) {
            rows.push({ type: "contains_letters", letters: [CONTAINS_LETTER_OPTIONS[i], CONTAINS_LETTER_OPTIONS[j], CONTAINS_LETTER_OPTIONS[k]], minLen: 3, maxLen: null });
          }
        }
      }

      for (let i = 0; i < 400; i++) {
        const sequenceQuestion = buildRandomSequenceQuestionCandidate();
        if (!sequenceQuestion || sequenceKeys.has(sequenceQuestion.sequence)) continue;
        sequenceKeys.add(sequenceQuestion.sequence);
        rows.push(sequenceQuestion);
      }

      return shuffleArray(rows);
    }

    function buildRandomQuestionFromDictionary() {
      if (dictionary.size === 0) return null;

      const dictionaryWords = Array.from(dictionary);
      let nearestFallback = null;

      for (let attempt = 0; attempt < QUESTION_PICK_MAX_ATTEMPTS; attempt++) {
        const candidate = buildRandomQuestionCandidate(dictionaryWords);
        if (!candidate) continue;
        if (isQuestionAlreadyUsed(candidate)) continue;

        const candidates = dictionaryWords.filter((word) => isWordMatchingQuestion(word, candidate));
        const sameAsLast = candidate.type && candidate.type === state.lastQuestionType;
        if (sameAsLast && attempt < RECENT_TYPE_SKIP_THRESHOLD) {
          continue;
        }

        if (acceptsCandidateCount(candidate, candidates.length)) {
          return hydrateQuestion(candidate, candidates);
        }

        const distance = getQuestionCandidateCountDistance(candidate, candidates.length);
        if (!nearestFallback || distance < nearestFallback.distance) {
          nearestFallback = { q: candidate, candidates, distance };
        }
      }

      const fallbackRows = buildFallbackQuestionCandidates(dictionaryWords);
      for (const fallbackQuestion of fallbackRows) {
        if (isQuestionAlreadyUsed(fallbackQuestion)) continue;
        const candidates = dictionaryWords.filter((word) => isWordMatchingQuestion(word, fallbackQuestion));

        if (acceptsCandidateCount(fallbackQuestion, candidates.length)) {
          return hydrateQuestion(fallbackQuestion, candidates);
        }

        const distance = getQuestionCandidateCountDistance(fallbackQuestion, candidates.length);
        if (!nearestFallback || distance < nearestFallback.distance) {
          nearestFallback = { q: fallbackQuestion, candidates, distance };
        }
      }

      if (!nearestFallback) return null;

      return hydrateQuestion(nearestFallback.q, nearestFallback.candidates);
    }

    function isWordMatchingQuestion(word, q) {
      if (!word || word.length < 3) return false;
      if (!/^[a-z]+$/.test(word)) return false;
      const type = q && q.type ? q.type : "start_end";

      // normalize older names to the new canonical types
      let t = type;
      if (type === "start_min_length") t = "edge_min_length";
      if (type === "end_min_length") t = "edge_min_length";
      if (type === "second_letter") t = "nth_letter";
      if (type === "contains_both") t = "contains_letters";

      switch (t) {
        case "start_end":
          if (!q.start || !q.end) return false;
          if (word[0] !== q.start) return false;
          if (word[word.length - 1] !== q.end) return false;
          break;

        case "edge_min_length":
          if (q.side === "start") {
            if (!q.start) return false;
            if (word[0] !== q.start) return false;
            if (q.minLen && word.length < q.minLen) return false;
          } else {
            if (!q.end) return false;
            if (word[word.length - 1] !== q.end) return false;
            if (q.minLen && word.length < q.minLen) return false;
          }
          break;

        case "nth_letter":
          if (!q.n || !q.letter) return false;
          if (word.length < q.n) return false;
          if (q.direction === "back") {
            if (word[word.length - q.n] !== q.letter) return false;
          } else if (word[q.n - 1] !== q.letter) {
            return false;
          }
          break;

        case "contains_letters":
          if (!q.letters || q.letters.length < 1) return false;
          if (!q.letters.every((letter) => word.includes(letter))) return false;
          break;

        case "contains_sequence":
          if (!q.sequence) return false;
          if (!word.includes(q.sequence)) return false;
          break;

        default:
          return false;
      }

      if (q.minLen && word.length < q.minLen) return false;
      if (q.maxLen && word.length > q.maxLen) return false;
      return true;
    }

    function getLengthRuleText(q) {
      if (!q) return "-";
      switch (q.type) {
        case "edge_min_length":
          return q.lengthMode === "exact" ? `${q.minLen}` : `${q.minLen}+`;
        case "nth_letter":
          return `${q.n}+`;
        case "start_min_length":
        case "end_min_length":
          return `${q.minLen}+`;
        case "start_end":
          if (q.minLen && q.maxLen && q.minLen === q.maxLen) return `${q.minLen} letters`;
          if (q.minLen && q.maxLen) return `${q.minLen}-${q.maxLen}`;
          if (q.minLen) return `${q.minLen}+`;
          if (q.maxLen) return `<= ${q.maxLen}`;
          return "3+";
        default:
          return "3+";
      }
    }

    function unlockSoundEffects() {
      if (soundUnlocked) return;
      soundUnlocked = true;

      Object.values(soundEffects).forEach((sound) => {
        try {
          sound.muted = true;
          sound.currentTime = 0;
          const playPromise = sound.play();
          if (playPromise && typeof playPromise.then === "function") {
            playPromise
              .then(() => {
                sound.pause();
                sound.currentTime = 0;
                sound.muted = false;
              })
              .catch(() => {
                sound.muted = false;
              });
          } else {
            sound.pause();
            sound.currentTime = 0;
            sound.muted = false;
          }
        } catch (_) {
          sound.muted = false;
        }
      });
    }

        if (playPromise && typeof playPromise.catch === "function") {

    }

    function renderNthLetterPattern(position, letter, direction = "front", highlight = false) {
      const cells = [];

      if (direction === "back") {
        cells.push("•••");
        cells.push(highlight ? `<span class="target">${escapeHtml(letter.toUpperCase())}</span>` : escapeHtml(letter.toUpperCase()));
        for (let i = 1; i < position; i++) {
          cells.push("_");
        }
      } else {
        for (let i = 1; i <= position; i++) {
          const value = i === position ? letter.toUpperCase() : "_";
          cells.push(highlight && i === position ? `<span class="target">${escapeHtml(value)}</span>` : escapeHtml(value));
        }
        cells.push("•••");
      }

      return cells.join(" ");
    }

    function renderNthLetterRule(position, letter, direction = "front") {
      const caption = direction === "back"
        ? `FROM END ${position} = ${letter ? letter.toUpperCase() : "?"}`
        : `POSITION ${position} = ${letter ? letter.toUpperCase() : "?"}`;
      return `
        <div class="rule-single">
          <div class="caption">${escapeHtml(caption)}</div>
          <div class="rule-pattern">${renderNthLetterPattern(position, letter || "?", direction, true)}</div>
        </div>
      `;
    }

    function renderRuleVisual(q) {
      if (!q) {
        return `<div class="rule-placeholder">Press Start</div>`;
      }

      switch (q.type) {
        case "start_end":
          return renderTwoBoxRule(
            "START",
            q.start ? q.start.toUpperCase() : "?",
            "→",
            "END",
            q.end ? q.end.toUpperCase() : "?"
          );

        case "edge_min_length":
          if (q.side === "start") {
            return renderTwoBoxRule(
              "START",
              q.start ? q.start.toUpperCase() : "?",
              "+",
              "LENGTH",
              q.lengthMode === "exact" ? `${q.minLen}` : `${q.minLen}+`
            );
          }

          return renderTwoBoxRule(
            "LENGTH",
            q.lengthMode === "exact" ? `${q.minLen}` : `${q.minLen}+`,
            "+",
            "END",
            q.end ? q.end.toUpperCase() : "?"
          );

        case "nth_letter":
          return renderNthLetterRule(q.n, q.letter, q.direction || "front");

        case "contains_letters":
          return renderChipRule(
            "INCLUDE ALL",
            (q.letters || []).map((letter) => letter.toUpperCase())
          );

        case "contains_sequence":
          return renderSingleRule(
            "CONTAINS SEQUENCE",
            q.sequence ? q.sequence.toUpperCase() : "?"
          );

        default:
          return renderSingleRule("RULE", getQuestionLabel(q));
      }
    }

    function shuffleArray(array) {
      const copy = array.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }
