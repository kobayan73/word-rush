    function buildOnlineQuestionSet(count = 20) {
      const questions = [];
      const usedKeys = new Set();
      const previousUsedKeys = state.usedQuestionKeys;
      const previousLastQuestionType = state.lastQuestionType;

      state.usedQuestionKeys = usedKeys;
      state.lastQuestionType = null;

      for (let i = 0; i < count; i++) {
        const q = buildRandomQuestionFromDictionary();
        if (!q) break;

        const key = getQuestionKey(q);
        if (usedKeys.has(key)) continue;
        usedKeys.add(key);
        state.lastQuestionType = q.type;

        questions.push({
          round: questions.length + 1,
          type: q.type,
          start: q.start || null,
          end: q.end || null,
          side: q.side || null,
          lengthMode: q.lengthMode || null,
          minLen: q.minLen || null,
          maxLen: q.maxLen || null,
          direction: q.direction || null,
          n: q.n || null,
          letter: q.letter || null,
          letters: q.letters || null,
          sequence: q.sequence || null,
          candidateCount: q.candidateCount || null,
          label: getQuestionLabel(q)
        });
      }

      state.usedQuestionKeys = previousUsedKeys;
      state.lastQuestionType = previousLastQuestionType;
      return questions;
    }

    async function createFriendRoom() {
      const client = ensureSupabaseClient();
      if (!client) return;

      const playerId = getOrCreatePlayerId();
      const roomCode = generateRoomCode();
      const room = {
        room_code: roomCode,
        mode: "friend",
        status: "waiting",
        host_id: playerId,
        host_name: "Host",
        scores: { A: 0, B: 0 },
        current_round: 0
      };

      const { data, error } = await client
        .from("word_rush_rooms")
        .insert(room)
        .select()
        .single();

      if (error) {
        console.error(error);
        setFriendMatchStatus("Failed to create room.");
        return;
      }

      onlineState.enabled = true;
      onlineState.mode = "friend";
      onlineState.roomId = data.id;
      onlineState.roomCode = data.room_code;
      onlineState.playerId = playerId;
      onlineState.playerRole = "host";
      onlineState.isHost = true;
      onlineState.questionSet = Array.isArray(data.question_set) ? data.question_set : [];

      showWaitingRoom(data);
      await subscribeRoom(data.id);
    }

    async function joinFriendRoom(roomCode) {
      const client = ensureSupabaseClient();
      if (!client) return;

      const playerId = getOrCreatePlayerId();
      const code = String(roomCode || "").trim().toUpperCase();
      if (!code) {
        setFriendMatchStatus("Room code is required.");
        return;
      }

      const { data: room, error: findError } = await client
        .from("word_rush_rooms")
        .select("*")
        .eq("room_code", code)
        .eq("status", "waiting")
        .single();

      if (findError || !room) {
        console.error(findError);
        setFriendMatchStatus("Room not found or already started.");
        return;
      }

      const { data: updatedRoom, error: updateError } = await client
        .from("word_rush_rooms")
        .update({
          guest_id: playerId,
          guest_name: "Guest",
          updated_at: new Date().toISOString()
        })
        .eq("id", room.id)
        .is("guest_id", null)
        .select()
        .single();

      if (updateError) {
        console.error(updateError);
        setFriendMatchStatus("Failed to join room.");
        return;
      }

      onlineState.enabled = true;
      onlineState.mode = "friend";
      onlineState.roomId = updatedRoom.id;
      onlineState.roomCode = updatedRoom.room_code;
      onlineState.playerId = playerId;
      onlineState.playerRole = "guest";
      onlineState.isHost = false;
      onlineState.opponentId = updatedRoom.host_id || null;
      onlineState.questionSet = Array.isArray(updatedRoom.question_set) ? updatedRoom.question_set : [];

      showWaitingRoom(updatedRoom);
      await subscribeRoom(updatedRoom.id);
    }

    async function subscribeRoom(roomId) {
      const client = ensureSupabaseClient();
      if (!client) return;

      if (onlineState.channel) {
        await client.removeChannel(onlineState.channel);
        onlineState.channel = null;
      }

      const channel = client
        .channel(`word_rush_room_${roomId}`)
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "word_rush_rooms",
            filter: `id=eq.${roomId}`
          },
          (payload) => {
            handleRoomUpdate(payload.new);
          }
        )
        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "word_rush_room_events",
            filter: `room_id=eq.${roomId}`
          },
          (payload) => {
            handleRoomEvent(payload.new);
          }
        )
        .subscribe();

      onlineState.channel = channel;
    }

    async function handleRoomUpdate(room) {
      if (!room) return;

      onlineState.roomId = room.id;
      onlineState.roomCode = room.room_code;
      onlineState.opponentId = onlineState.playerRole === "host" ? room.guest_id : room.host_id;
      if (Array.isArray(room.question_set)) onlineState.questionSet = room.question_set;

      if (room.status === "abandoned" && onlineState.enabled && !onlineState.leavingOnline) {
        showRoomDissolvedAndReturnTitle();
        return;
      }

      if (room.status === "playing") {
        if (onlineState.questionSet.length) startOnlineMatch();
        return;
      }

      if (room.status === "finished") {
        $("waitingRoomPanel").classList.add("hidden");
        $("friendMatchPanel").classList.add("hidden");
        $("startScreen").classList.add("hidden");
        const scores = room.scores || {};
        if (Number.isFinite(Number(scores.A))) state.scores.A = Number(scores.A);
        if (Number.isFinite(Number(scores.B))) state.scores.B = Number(scores.B);
        finishOnlineMatch(Number(state.scores.A) >= Number(state.scores.B) ? "A" : "B", { publish: false });
        return;
      }

      showWaitingRoom(room);

      if (room.status === "countdown") {
        setWaitingRoomStatus("Starting...");
      }

      if (onlineState.isHost && room.status === "waiting" && room.guest_id && !onlineState.countdownStarted) {
        await startOnlineCountdownAsHost(room);
      }
    }

    async function publishRoomEvent(eventType, payload = {}) {
      const client = ensureSupabaseClient();
      if (!client || !onlineState.roomId) return;

      const { error } = await client.from("word_rush_room_events").insert({
        room_id: onlineState.roomId,
        event_type: eventType,
        player_id: onlineState.playerId,
        player_role: onlineState.playerRole,
        payload
      });

      if (error) {
        console.error("Failed to publish event:", eventType, error);
      }
    }

    async function startOnlineCountdownAsHost(room) {
      if (onlineState.countdownStarted) return;
      onlineState.countdownStarted = true;

      const client = ensureSupabaseClient();
      if (!client) return;

      const questionSet = buildOnlineQuestionSet(20);
      onlineState.questionSet = questionSet;

      await client
        .from("word_rush_rooms")
        .update({
          status: "countdown",
          question_set: questionSet,
          updated_at: new Date().toISOString()
        })
        .eq("id", room.id);

      await publishRoomEvent("countdown_started", { startsInMs: 3000 });
      setWaitingRoomStatus("Starting in 3...");

      setTimeout(async () => {
        await client
          .from("word_rush_rooms")
          .update({
            status: "playing",
            started_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
          })
          .eq("id", room.id);

        await publishRoomEvent("match_started", {});
        startOnlineMatch();
      }, 3000);
    }

    function startOnlineMatch() {
      if (!onlineState.questionSet.length) {
        setWaitingRoomStatus("Waiting for questions...");
        return;
      }

      if (
        onlineState.enabled &&
        state.status === "playing" &&
        state.currentQuestion &&
        state.matchMode !== "single" &&
        !$("gameScreen").classList.contains("hidden") &&
        $("waitingRoomPanel").classList.contains("hidden")
      ) {
        return;
      }

      $("startScreen").classList.add("hidden");
      $("friendMatchPanel").classList.add("hidden");
      $("waitingRoomPanel").classList.add("hidden");
      $("gameScreen").classList.remove("hidden");
      $("gameScreen").classList.add("versus-mode");

      clearInterval(state.timer);
      hideModal();
      clearScoreEffects();
      state.matchMode = onlineState.mode || "friend";
      state.status = "playing";
      state.roundIndex = 0;
      state.scores = { A: 0, B: 0 };
      state.roundRoundScores = { A: 0, B: 0 };
      state.usedWords = new Set();
      state.usedQuestionKeys = new Set();
      state.matchOver = false;
      onlineState.rematchReadyPlayers = new Set();

      startOnlineRound(0);
    }

    function startOnlineRound(index) {
      const q = onlineState.questionSet[index];
      if (!q) {
        finishOnlineMatch(null);
        return;
      }

      state.roundIndex = index;
      state.currentQuestion = {
        ...q,
        note: [getQuestionLabel(q), getQuestionRuleNote(q.candidateCount || 0)].filter(Boolean).join(". ")
      };
      state.roundWords = { A: [], B: [] };
      state.roundRoundScores = { A: 0, B: 0 };
      state.usedWords = new Set();
      state.remainingMs = ROUND_SECONDS * 1000;
      state.roundDuration = ROUND_SECONDS;
      state.roundStart = performance.now();
      state.status = "playing";

      clearAnswerArea();
      setStatus("Online");
      setMessage("", "");

      clearInterval(state.timer);
      state.timer = setInterval(tickTimer, 50);
      updateUI();
      $("inputA").focus();
    }

    function nextOnlineRound() {
      if (state.matchOver) return;
      startOnlineRound(state.roundIndex + 1);
    }

    function getOnlineWinnerPlayerId(winner) {
      if (winner === "A") return onlineState.playerId || null;
      if (winner === "B") return onlineState.opponentId || null;
      return null;
    }

    function getOnlineLoserPlayerId(winner) {
      if (winner === "A") return onlineState.opponentId || null;
      if (winner === "B") return onlineState.playerId || null;
      return null;
    }

    async function publishOnlineMatchFinished(winner) {
      if (!onlineState.enabled || !onlineState.roomId) return;

      await publishRoomEvent("match_finished", {
        winnerPlayerId: getOnlineWinnerPlayerId(winner),
        loserPlayerId: getOnlineLoserPlayerId(winner),
        winnerLocalPlayer: winner || null,
        winnerScore: winner === "A" ? state.scores.A : winner === "B" ? state.scores.B : null,
        loserScore: winner === "A" ? state.scores.B : winner === "B" ? state.scores.A : null,
        scores: {
          self: state.scores.A,
          opponent: state.scores.B
        },
        localScores: {
          A: state.scores.A,
          B: state.scores.B
        },
        scorePerspective: "sender"
      });
    }

    async function finishOnlineMatch(winner, options = {}) {
      if (state.matchOver) return;
      const publish = options.publish !== false;
      const resolvedWinner = winner || (state.scores.A === state.scores.B ? null : state.scores.A > state.scores.B ? "A" : "B");
      clearInterval(state.timer);
      state.status = "match_over";
      state.matchOver = true;
      setStatus("Match over");
      setMessage("Match over.", "success");

      if (publish && onlineState.enabled) {
        await publishOnlineMatchFinished(resolvedWinner);

        const client = ensureSupabaseClient();
        if (client && onlineState.roomId) {
          await client
            .from("word_rush_rooms")
            .update({
              status: "finished",
              scores: state.scores,
              finished_at: new Date().toISOString(),
              updated_at: new Date().toISOString()
            })
            .eq("id", onlineState.roomId);
        }
      }

      updateUI();
      setTimeout(() => showModal(resolvedWinner), 700);
    }

    async function requestFriendRematch() {
      const client = ensureSupabaseClient();
      if (!client || !onlineState.roomId) return;

      hideModal();
      clearInterval(state.timer);
      state.status = "match_over";
      state.matchOver = true;
      onlineState.countdownStarted = false;
      onlineState.questionSet = [];
      if (!(onlineState.rematchReadyPlayers instanceof Set)) {
        onlineState.rematchReadyPlayers = new Set();
      }
      onlineState.rematchReadyPlayers.add(onlineState.playerId);

      $("gameScreen").classList.add("hidden");
      $("gameScreen").classList.remove("versus-mode");
      showWaitingRoom({
        id: onlineState.roomId,
        room_code: onlineState.roomCode,
        status: "rematch waiting",
        host_id: onlineState.playerRole === "host" ? onlineState.playerId : onlineState.opponentId,
        guest_id: onlineState.playerRole === "guest" ? onlineState.playerId : onlineState.opponentId
      });
      setWaitingRoomStatus(`Waiting for rematch... ${onlineState.rematchReadyPlayers.size}/2`);

      await client
        .from("word_rush_rooms")
        .update({
          status: "rematch_waiting",
          question_set: null,
          scores: { A: 0, B: 0 },
          current_round: 0,
          updated_at: new Date().toISOString()
        })
        .eq("id", onlineState.roomId);

      await publishRoomEvent("rematch_ready", {});
    }

    async function handleRematchReady(event) {
      if (!onlineState.enabled || onlineState.mode !== "friend") return;
      onlineState.rematchReadyPlayers.add(event.player_id);
      setWaitingRoomStatus(`Waiting for rematch... ${onlineState.rematchReadyPlayers.size}/2`);

      if (onlineState.isHost && onlineState.rematchReadyPlayers.size >= 2 && !onlineState.countdownStarted) {
        await startOnlineCountdownAsHost({
          id: onlineState.roomId,
          room_code: onlineState.roomCode,
          host_id: onlineState.playerRole === "host" ? onlineState.playerId : onlineState.opponentId,
          guest_id: onlineState.playerRole === "guest" ? onlineState.playerId : onlineState.opponentId,
          status: "rematch_waiting"
        });
      }
    }

    async function showRoomDissolvedAndReturnTitle() {
      const client = supabaseClient;
      if (client && onlineState.channel) {
        await client.removeChannel(onlineState.channel);
      }
      alert("Room was closed.");
      resetMatch();
      resetOnlineState();
      state.matchMode = "single";
      hideModal();
      hideWaitingRoom();
      showStartScreen();
    }

    function handleRoomEvent(event) {
      if (!event) return;
      if (event.id && onlineState.processedEventIds.has(event.id)) return;
      if (event.id) onlineState.processedEventIds.add(event.id);

      const payload = event.payload || {};
      const isMine = event.player_id === onlineState.playerId;

      if (event.event_type === "countdown_started") {
        setWaitingRoomStatus("Starting...");
        return;
      }

      if (event.event_type === "match_started") {
        startOnlineMatch();
        return;
      }

      if (event.event_type === "rematch_ready") {
        handleRematchReady(event);
        return;
      }

      if (event.event_type === "room_dissolved") {
        if (!isMine && onlineState.mode === "friend") {
          showRoomDissolvedAndReturnTitle();
        }
        return;
      }

      if (event.event_type === "word_accepted") {
        if (isMine) return;
        if (payload.roundIndex !== state.roundIndex) return;

        const word = normalizeWord(payload.word);
        if (!word) return;
        const points = Number(payload.points || getWordScore(word));
        state.usedWords.add(word);
        state.roundWords.B.push(word);
        state.scores.B += points;
        state.roundRoundScores.B += points;

        if (state.scores.B >= WIN_SCORE) {
          finishOnlineMatch("B", { publish: false });
          return;
        }

        updateUI();
        return;
      }

      if (event.event_type === "match_finished") {
        if (state.matchOver) return;

        if (payload.scores && !isMine) {
          const opponentScore = Number(payload.scores.self);
          const myScore = Number(payload.scores.opponent);
          if (Number.isFinite(myScore)) state.scores.A = myScore;
          if (Number.isFinite(opponentScore)) state.scores.B = opponentScore;
        }

        if (payload.scores && isMine) {
          const myScore = Number(payload.scores.self);
          const opponentScore = Number(payload.scores.opponent);
          if (Number.isFinite(myScore)) state.scores.A = myScore;
          if (Number.isFinite(opponentScore)) state.scores.B = opponentScore;
        }

        const winnerPlayerId = payload.winnerPlayerId || null;
        if (!winnerPlayerId) {
          console.warn("match_finished event is missing winnerPlayerId.", payload);
          finishOnlineMatch(null, { publish: false });
          return;
        }

        const iWon = winnerPlayerId === onlineState.playerId;
        finishOnlineMatch(iWon ? "A" : "B", { publish: false });
      }
    }

    async function enterRandomMatch() {
      const client = ensureSupabaseClient();
      if (!client) return;

      const playerId = getOrCreatePlayerId();
      onlineState.enabled = true;
      onlineState.mode = "random";
      onlineState.playerId = playerId;

      const { data: waitingRows, error: findError } = await client
        .from("word_rush_random_queue")
        .select("*")
        .eq("status", "waiting")
        .neq("player_id", playerId)
        .order("created_at", { ascending: true })
        .limit(1);

      if (findError) {
        console.error(findError);
        setStartNotice("Failed to find random match.", "warn");
        return;
      }

      const opponentQueue = waitingRows && waitingRows[0];
      if (opponentQueue) {
        const roomCode = generateRoomCode();
        const room = {
          room_code: roomCode,
          mode: "random",
          status: "waiting",
          host_id: opponentQueue.player_id,
          guest_id: playerId,
          host_name: opponentQueue.player_name || "Host",
          guest_name: "Guest",
          scores: { A: 0, B: 0 },
          current_round: 0
        };

        const { data: createdRoom, error: roomError } = await client
          .from("word_rush_rooms")
          .insert(room)
          .select()
          .single();

        if (roomError) {
          console.error(roomError);
          setStartNotice("Failed to create random room.", "warn");
          return;
        }

        await client
          .from("word_rush_random_queue")
          .update({
            status: "matched",
            room_id: createdRoom.id,
            updated_at: new Date().toISOString()
          })
          .eq("id", opponentQueue.id);

        onlineState.roomId = createdRoom.id;
        onlineState.roomCode = createdRoom.room_code;
        onlineState.playerRole = "guest";
        onlineState.isHost = false;
        onlineState.opponentId = opponentQueue.player_id;
        showWaitingRoom(createdRoom);
        await subscribeRoom(createdRoom.id);
        return;
      }

      const { data: queueRow, error: queueError } = await client
        .from("word_rush_random_queue")
        .insert({
          player_id: playerId,
          player_name: "Host",
          status: "waiting"
        })
        .select()
        .single();

      if (queueError) {
        console.error(queueError);
        setStartNotice("Failed to enter random queue.", "warn");
        return;
      }

      onlineState.queueId = queueRow.id;
      onlineState.playerRole = "host";
      onlineState.isHost = true;
      showWaitingRoom({
        room_code: "RANDOM",
        status: "waiting",
        host_id: playerId,
        guest_id: null
      });
      await subscribeRandomQueue(queueRow.id);
    }

    async function subscribeRandomQueue(queueId) {
      const client = ensureSupabaseClient();
      if (!client) return;

      if (onlineState.channel) {
        await client.removeChannel(onlineState.channel);
        onlineState.channel = null;
      }

      const channel = client
        .channel(`word_rush_random_queue_${queueId}`)
        .on(
          "postgres_changes",
          {
            event: "*",
            schema: "public",
            table: "word_rush_random_queue",
            filter: `id=eq.${queueId}`
          },
          async (payload) => {
            const row = payload.new;
            if (!row || !row.room_id) return;

            const { data: room, error } = await client
              .from("word_rush_rooms")
              .select("*")
              .eq("id", row.room_id)
              .single();

            if (error || !room) {
              console.error(error);
              setWaitingRoomStatus("Failed to load matched room.");
              return;
            }

            onlineState.roomId = room.id;
            onlineState.roomCode = room.room_code;
            onlineState.playerRole = "host";
            onlineState.isHost = true;
            onlineState.opponentId = room.guest_id || null;
            onlineState.channel = null;
            await client.removeChannel(channel);
            showWaitingRoom(room);
            await subscribeRoom(room.id);

            if (room.guest_id && !onlineState.countdownStarted) {
              await startOnlineCountdownAsHost(room);
            }
          }
        )
        .subscribe();

      onlineState.channel = channel;
    }

    async function cancelOnlineMatch() {
      const client = ensureSupabaseClient();
      onlineState.leavingOnline = true;

      if (client && onlineState.roomId) {
        await client
          .from("word_rush_rooms")
          .update({
            status: "abandoned",
            updated_at: new Date().toISOString()
          })
          .eq("id", onlineState.roomId);
      }

      if (client && onlineState.queueId) {
        await client
          .from("word_rush_random_queue")
          .update({
            status: "cancelled",
            updated_at: new Date().toISOString()
          })
          .eq("id", onlineState.queueId);
      }

      if (client && onlineState.channel) {
        await client.removeChannel(onlineState.channel);
      }

      resetOnlineState();
      hideWaitingRoom();
      showStartScreen();
    }

    async function cancelRandomMatch() {
      await cancelOnlineMatch();
    }

    function resetMatch() {
      clearInterval(state.timer);
      state.status = "ready";
      state.roundIndex = 0;
      state.currentQuestion = null;
      state.scores = { A: 0, B: 0 };
      state.roundWords = { A: [], B: [] };
      state.roundRoundScores = { A: 0, B: 0 };
      state.usedWords = new Set();
      state.usedQuestionKeys = new Set();
      state.matchOver = false;
      state.roundDuration = ROUND_SECONDS;
      state.remainingMs = ROUND_SECONDS * 1000;
      $("gameScreen").classList.toggle("versus-mode", state.matchMode !== "single");
      const logEl = $("log");
      if (logEl) logEl.innerHTML = "";
      hideModal();
      setMessage("", "");
      setStatus("Ready");
      updateUI();
      log("Match reset.");
    }

    function startRound() {
      clearInterval(state.timer);
      state.currentQuestion = pickQuestion();
      if (!state.currentQuestion) {
        state.status = "ready";
        setStatus("No questions");
        setMessage("No new questions are available for this session. Reload the page to start a new match.", "warn");
        updateUI();
        log("No unused question could be generated.");
        return;
      }
      state.roundWords = { A: [], B: [] };
      state.roundRoundScores = { A: 0, B: 0 };
      state.usedWords = new Set();
      clearAnswerArea();
      const q = state.currentQuestion;
      const candidates = wordsForQuestion(q);
      q.candidateCount = candidates.length;
      state.roundDuration = getQuestionRoundSeconds(q);
      state.remainingMs = state.roundDuration * 1000;
      state.roundStart = performance.now();
      state.status = "playing";
      state.lastQuestionType = q.type;
      state.usedQuestionKeys.add(getQuestionKey(q));

      log(`Round ${state.roundIndex + 1}: ${getQuestionLabel(q)}, candidates ${candidates.length}, time ${getQuestionRoundSeconds(q)}s.`);
      setMessage("", "");
      setStatus("Playing");

      state.timer = setInterval(tickTimer, 50);
      updateUI();
      $("inputA").focus();
    }

    function tickTimer() {
      if (state.status !== "playing") return;
      const elapsed = performance.now() - state.roundStart;
      const totalMs = (state.roundDuration || ROUND_SECONDS) * 1000;
      state.remainingMs = Math.max(0, totalMs - elapsed);

      if (state.remainingMs <= 0) {
        clearInterval(state.timer);
        handleTimeUp();
      }

      updateTimerUI();
    }

    function handleTimeUp() {
      const localPlayerRoundScore = state.roundRoundScores.A;
      let message = `Time is up. Round score: +${localPlayerRoundScore}.`;
      let logMessage = `Round ${state.roundIndex + 1} ended. +${localPlayerRoundScore}.`;

      // 対戦モードでのみ減点ルールを適用
      if (state.matchMode !== "single") {
        // このラウンドで1つも回答できなかった場合
        if (state.roundWords.A.length === 0) {
          const opponentRoundScore = state.roundRoundScores.B;
          if (opponentRoundScore > 0) {
            // 減点後のスコアが0未満にならないように調整
            state.scores.A = Math.max(0, state.scores.A - opponentRoundScore);
            message += ` Your score was reduced because your opponent scored ${opponentRoundScore} points.`;
            logMessage += ` Player A received penalty based on opponent's score ${opponentRoundScore}.`;
          } else {
            message += ` No penalty was applied because your opponent did not score.`;
          }
        }
      }

      message += ` Moving to the next round.`;
      setMessage(message, "warn");
      log(logMessage);
      state.status = "between_rounds";
      setStatus("Round over");
      updateUI();
      setTimeout(onlineState.enabled ? nextOnlineRound : nextRound, 1400);
    }

    function submitWord(player) {
      if (state.status !== "playing" || !state.currentQuestion) return;

      const input = $("inputA");
      const hint = $("hintA");
      const word = normalizeWord(input.value);
      input.value = "";

      const result = validateWord(word, player);

      if (!result.ok) {
        hint.textContent = result.message;
        hint.style.color = "#dc2626";
        playSound("far");
        log(`${getMatchModeLabel()}: rejected ${word || "(blank)"} - ${result.message}`);
        updateUI();
        return;
      }

      const points = getEffectiveWordScore(word);
      const wasClear = state.scores[player] >= WIN_SCORE;
      state.roundWords[player].push(word);
      state.usedWords.add(word);
      state.scores[player] += points;
      state.roundRoundScores[player] += points;
      hint.textContent = `OK: ${word} +${points}`;
      hint.style.color = "#0284c7";
      log(`${getMatchModeLabel()}: ${word} accepted (+${points}).`);

      if (onlineState.enabled) {
        publishRoomEvent("word_accepted", {
          roundIndex: state.roundIndex,
          word,
          points,
          totalScore: state.scores[player],
          player
        });
      }

      if (state.scores[player] >= WIN_SCORE) {
        triggerScoreImpactEffect("correct");
        if (onlineState.enabled) {
          finishOnlineMatch("A");
        } else {
          finishMatch(player, 900);
        }
        return;
      }

      if (!wasClear) triggerScoreImpactEffect("normal");
      updateUI();
      input.focus();
    }

    function validateWord(word, player) {
      const q = state.currentQuestion;

      if (!word) return { ok: false, message: "Enter a word." };
      if (word.length < 3) return { ok: false, message: "Use at least 3 letters." };
      if (!/^[a-z]+$/.test(word)) return { ok: false, message: "Use only a-z letters." };
      if (!dictionary.has(word)) return { ok: false, message: "This word is not in the dictionary." };
      if (state.usedWords.has(word)) return { ok: false, message: "This word has already been used this round." };
      if (!isWordMatchingQuestion(word, q)) {
        return {
          ok: false,
          message: `This word does not match: ${getQuestionLabel(q)}.`
        };
      }

      return { ok: true, message: "OK" };
    }


    function nextRound() {
      if (state.matchOver) return;
      if (onlineState.enabled) {
        nextOnlineRound();
        return;
      }
      state.roundIndex += 1;
      startRound();
    }

    function skipRound() {
      if (state.status !== "playing" && state.status !== "between_rounds") return;
      clearInterval(state.timer);
      log("Round skipped.");
      setMessage("Round skipped.", "warn");
      nextRound();
    }

    function finishMatch(winner, modalDelay = 0) {
      clearInterval(state.timer);
      state.status = "match_over";
      state.matchOver = true;
      setStatus("Match over");
      setMessage(state.matchMode === "single" ? "Clear! You reached 50 points." : "Match over.", "success");
      updateUI();
      setTimeout(() => showModal(winner), modalDelay);
      log(`${getMatchModeLabel().toUpperCase()} FINISHED: Winner ${winner}.`);
    }

    function showModal(winner) {
      const isSingle = state.matchMode === "single";
      const title = $("modalTitle");
      const message = $("modalMessage");
      const myScore = state.scores.A;
      const opponentScore = state.scores.B;
      const leftScore = winner === "A"
        ? Math.max(myScore, opponentScore)
        : winner === "B"
          ? Math.min(myScore, opponentScore)
          : myScore;
      const rightScore = winner === "A"
        ? Math.min(myScore, opponentScore)
        : winner === "B"
          ? Math.max(myScore, opponentScore)
          : opponentScore;

      if (isSingle) {
        title.textContent = "Clear!";
      } else if (onlineState.enabled) {
        title.textContent = winner === "A" ? "You Win" : winner === "B" ? "You Lose" : "Draw";
      } else {
        title.textContent = winner === "A" ? "You Win" : winner === "B" ? "You Lose" : "Draw";
      }
      title.classList.toggle("versus-result-title", !isSingle);

      message.className = "";
      if (isSingle) {
        message.textContent = "";
        message.hidden = true;
      } else {
        message.innerHTML = `
          <span class="score-left">${leftScore}</span>
          <span class="score-separator">-</span>
          <span class="score-right">${rightScore}</span>
        `;
        message.classList.add("versus-score");
        message.hidden = false;
      }
      $("modalBackdrop").classList.add("show");
    }

    function hideModal() {
      $("modalBackdrop").classList.remove("show");
      $("modalTitle").classList.remove("versus-result-title");
      $("modalMessage").className = "";
      $("modalMessage").hidden = false;
    }

    function clearScoreEffects() {
      const player = $("playerA");
      player.classList.remove("score-impact", "score-overtake", "score-correct");
      $("gameScreen").classList.remove("max-effect-shake");
      $("winFlashOverlay").classList.remove("flash-active");
      $("lightningLayer").classList.remove("lightning-active");
    }

    function triggerScoreImpactEffect(level = "normal") {
      const player = $("playerA");
      const intensityByLevel = {
        normal: 0.35,
        overtake: 0.75,
        correct: 1
      };

      player.style.setProperty("--impact-intensity", String(intensityByLevel[level] || 0.35));
      player.classList.remove("score-impact", "score-overtake", "score-correct");
      void player.offsetWidth;
      player.classList.add("score-impact");

      if (level === "overtake") {
        player.classList.add("score-overtake");
        playSound("rank");
      } else if (level === "correct") {
        player.classList.add("score-correct");
        playSounds(["correct1", "correct2"]);
        triggerWinEffect();
      } else {
        playSound("near");
      }

      setTimeout(() => {
        player.classList.remove("score-impact", "score-overtake", "score-correct");
      }, 700);
    }

    function triggerScoreOvertakeEffect() {
      triggerScoreImpactEffect("overtake");
    }

    function triggerWinEffect() {
      const variant = randomWinVariant();
      const imageSrc = lightningImageByVariant[variant] || lightningImageByVariant[1];
      const game = $("gameScreen");
      const flash = $("winFlashOverlay");
      const layer = $("lightningLayer");
      const image = $("lightningImage");

      image.setAttribute("src", imageSrc);
      game.classList.remove("max-effect-shake");
      flash.classList.remove("flash-active");
      layer.classList.remove("lightning-active");

      void game.offsetWidth;
      void flash.offsetWidth;
      void layer.offsetWidth;

      game.classList.add("max-effect-shake");
      flash.classList.add("flash-active");
      layer.classList.add("lightning-active");

      setTimeout(() => {
        game.classList.remove("max-effect-shake");
      }, 1100);
    }

    function clearAnswerArea() {
      $("inputA").value = "";
      $("wordsA").innerHTML = `<span class="hint">No valid words yet.</span>`;
      $("wordsB").innerHTML = `<span class="hint">No valid words yet.</span>`;
      $("hintA").textContent = "";
      $("hintA").style.color = "";
      $("hintB").textContent = "";
      $("hintB").style.color = "";
    }

    async function startAgainFromModal() {
      hideModal();
      if (onlineState.enabled) {
        if (onlineState.mode === "random") {
          const client = supabaseClient;
          if (client && onlineState.channel) {
            await client.removeChannel(onlineState.channel);
          }
          resetMatch();
          resetOnlineState();
          await enterRandomMatch();
          return;
        }

        if (onlineState.mode === "friend") {
          await requestFriendRematch();
          return;
        }
      }
      $("startScreen").classList.add("hidden");
      $("gameScreen").classList.remove("hidden");
      startMatch(state.matchMode || "single");
    }

    async function backToTitleFromModal() {
      hideModal();
      const client = supabaseClient;
      if (onlineState.enabled) {
        onlineState.leavingOnline = true;
      }
      if (onlineState.enabled && onlineState.mode === "friend" && onlineState.roomId) {
        await publishRoomEvent("room_dissolved", {});
        if (client) {
          await client
            .from("word_rush_rooms")
            .update({
              status: "abandoned",
              updated_at: new Date().toISOString()
            })
            .eq("id", onlineState.roomId);
        }
      }
      if (client && onlineState.channel) {
        await client.removeChannel(onlineState.channel);
      }
      resetMatch();
      resetOnlineState();
      state.matchMode = "single";
      $("gameScreen").classList.add("hidden");
      $("gameScreen").classList.remove("versus-mode");
      $("startScreen").classList.remove("hidden");
      hideWaitingRoom();
      setStartNotice(dictionary.size > 0 ? "Choose a mode to start." : "Loading dictionary...", dictionary.size > 0 ? "success" : "");
    }

    function updateTimerUI() {
      const totalMs = ((state.roundDuration || ROUND_SECONDS) * 1000);
      const ratio = Math.max(0, Math.min(1, state.remainingMs / totalMs));
      $("timebarFill").style.transform = `scaleX(${ratio})`;
      $("timebarText").textContent = `${Math.ceil(Math.max(0, state.remainingMs / 1000))}s`;
    }

    function updateMobileAnswerPanelOffset() {
      const panel = $("answerPanel");
      if (!panel) return;

      if (!window.visualViewport || window.innerWidth > 520) {
        panel.style.transform = "";
        return;
      }

      const viewport = window.visualViewport;
      const keyboardOffset = Math.max(0, window.innerHeight - viewport.height - viewport.offsetTop);

      panel.style.transform = keyboardOffset > 0
        ? `translate3d(0, ${-keyboardOffset}px, 0)`
        : "";
    }

    function renderWords(player) {
      const safePlayer = player === "B" ? "B" : "A";
      const container = $(safePlayer === "B" ? "wordsB" : "wordsA");
      const words = state.roundWords[safePlayer] || [];

      if (words.length === 0) {
        container.innerHTML = `<span class="hint">No valid words yet.</span>`;
        return;
      }

      container.innerHTML = words
        .map((word) => `<span class="word-chip">${escapeHtml(word)} +${getEffectiveWordScore(word)}</span>`)
        .join("");
    }

    function updateUI() {
      const q = state.currentQuestion;
      const isPlaying = state.status === "playing";
      const keepKeyboardReady = isPlaying || state.status === "between_rounds";
      const isVersus = state.matchMode !== "single";

      $("scorebarFill").style.transform = `scaleX(${Math.max(0, Math.min(1, state.scores.A / WIN_SCORE))})`;
      $("opponentScorebarFill").style.transform = `scaleX(${Math.max(0, Math.min(1, state.scores.B / WIN_SCORE))})`;
      $("gameScreen").classList.toggle("versus-mode", isVersus);
      $("roundLabel").textContent = q ? `Round ${state.roundIndex + 1}` : "Round 1";
      $("ruleVisual").innerHTML = renderRuleVisual(q);

      $("inputA").disabled = !keepKeyboardReady;
      $("submitA").disabled = !isPlaying;

      $("playerA").classList.toggle("active", isPlaying);
      $("playerB").classList.toggle("active", isVersus && isPlaying);

      renderWords("A");
      renderWords("B");
      updateTimerUI();
      updateMobileAnswerPanelOffset();
    }

    const singlePlayBtn = $("singlePlayBtn");
    if (singlePlayBtn) singlePlayBtn.onclick = beginSinglePlay;
    $("friendMatchBtn").onclick = showFriendMatchPanel;
    $("randomMatchBtn").onclick = enterRandomMatch;
    $("submitA").onclick = () => submitWord("A");
    $("startAgainBtn").onclick = startAgainFromModal;
    $("backToTitleBtn").onclick = backToTitleFromModal;
    const loadDictBtn = $("loadDictBtn");
    if (loadDictBtn) loadDictBtn.onclick = () => $("dictionaryFileInput").click();
    $("createFriendRoomBtn").onclick = createFriendRoom;
    $("showJoinRoomBtn").onclick = showFriendJoinRoomPanel;
    $("joinFriendRoomBtn").onclick = () => joinFriendRoom($("friendRoomCodeInput").value);
    $("friendBackBtn").onclick = hideFriendMatchPanel;
    $("friendJoinBackBtn").onclick = backToFriendMatchMenu;
    $("cancelOnlineMatchBtn").onclick = cancelOnlineMatch;
    const dictionaryFileInput = $("dictionaryFileInput");
    if (dictionaryFileInput) {
      dictionaryFileInput.addEventListener("change", (e) => {
        loadDictionaryFromFile(e.target.files && e.target.files[0]);
        e.target.value = "";
      });
    }

    $("inputA").addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitWord("A");
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", updateMobileAnswerPanelOffset);
      window.visualViewport.addEventListener("scroll", updateMobileAnswerPanelOffset);
    }
    window.addEventListener("resize", updateMobileAnswerPanelOffset);

    ["pointerdown", "touchstart", "keydown"].forEach((eventName) => {
      window.addEventListener(eventName, unlockSoundEffects, { once: true, passive: true });
    });

    prepareSoundEffects();
    preloadLightningImages();
    initializeSupabaseClient();
    updateDictionaryInfo();
    updateUI();
    log("Word Rush loaded. Loading ./words_alpha.txt from the same folder...");
    loadDictionary();
  </script>
</body>
</html>
